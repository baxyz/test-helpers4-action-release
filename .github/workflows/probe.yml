name: Probe
# Can GITHUB_TOKEN tag a commit that is on no branch when the tree holds .github/workflows/?
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Probe
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          HEAD_SHA=$(git rev-parse HEAD); PREV_SHA=$(git rev-parse HEAD~1)
          echo "HEAD=$HEAD_SHA (changes dummy.yml vs HEAD~1=$PREV_SHA)"
          report(){ echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "RESULT $1 => $2 $3"; }
          { echo "| Cas | Résultat | Détail |"; echo "| --- | --- | --- |"; } >> "$GITHUB_STEP_SUMMARY"

          # API: commit = <parent> tree + package.json changed, on no branch. Echoes the commit sha.
          api_commit(){ local parent=$1 ver=$2
            local ptree=$(gh api repos/$R/git/commits/$parent --jq .tree.sha)
            local content=$(printf '{ "name": "probe", "version": "%s", "private": true }\n' "$ver")
            local tree=$(jq -n --arg b "$ptree" --arg c "$content" '{base_tree:$b, tree:[{path:"package.json",mode:"100644",type:"blob",content:$c}]}' | gh api repos/$R/git/trees --input - --jq .sha)
            jq -n --arg t "$tree" --arg p "$parent" --arg m "chore(release): $ver" '{message:$m, tree:$t, parents:[$p]}' | gh api repos/$R/git/commits --input - --jq .sha; }
          api_tag(){ local name=$1 sha=$2 out
            if out=$(gh api repos/$R/git/refs -f ref="refs/tags/$name" -f sha="$sha" --jq .ref 2>&1); then echo "OK"; else echo "FAIL: $out"; fi; }
          verified(){ gh api repos/$R/commits/$1 --jq '"verified="+(.commit.verification.verified|tostring)+" reason="+.commit.verification.reason+" author="+.commit.author.name+" committer="+.commit.committer.name'; }

          C1=$(api_commit $HEAD_SHA 1.0.1-$ID); report "1 · API, commit hors branche, parent = HEAD de main" "$(api_tag p1-$ID $C1)" "$(verified $C1)"
          OLD=$(git rev-parse HEAD~1)
          C2=$(api_commit $OLD 1.0.2-$ID); report "2 · API, parent = HEAD~1 de main, sur aucune branche (workflows différents)" "$(api_tag p2-$ID $C2)" "-"

          MAINT_SHA=$(git rev-parse origin/maint)
          echo "maint=$MAINT_SHA (branch whose workflows differ from main)"

          # 6. Ref on an EXISTING commit whose workflows differ from main (no new commit)
          report "6a · API, nouvelle branche sur un commit existant (workflows différents de main)" "$(gh api repos/$R/git/refs -f ref=refs/heads/b6-$ID -f sha=$MAINT_SHA --jq .ref >/dev/null 2>&1 && echo OK || echo FAIL)" "-"
          report "6b · API, tag sur un commit existant (workflows différents de main)" "$(api_tag p6-$ID $MAINT_SHA)" "-"

          # 7. Release commit whose parent is the HEAD of the maint branch
          C7=$(api_commit $MAINT_SHA 1.0.7-$ID); report "7 · API, commit de release, parent = HEAD de la branche maint" "$(api_tag p7-$ID $C7)" "$(verified $C7)"

          # 8. Same, but first pushed as the new HEAD of maint (fast-forward), then tagged
          C8=$(api_commit $MAINT_SHA 1.0.8-$ID)
          if out=$(gh api -X PATCH repos/$R/git/refs/heads/maint -f sha=$C8 --jq .object.sha 2>&1); then ff=OK; else ff="FAIL: $out"; fi
          report "8 · API, fast-forward de maint vers le commit de release, puis tag" "ff=$ff tag=$(api_tag p8-$ID $C8)" "-"

          # 9. Release commit whose parent is main HEAD, tree = maint tree (workflows of maint)
          MTREE=$(gh api repos/$R/git/commits/$MAINT_SHA --jq .tree.sha)
          C9=$(jq -n --arg t "$MTREE" --arg p "$HEAD_SHA" '{message:"probe 9", tree:$t, parents:[$p]}' | gh api repos/$R/git/commits --input - --jq .sha)
          report "9 · API, parent = HEAD de main mais arbre = celui de maint" "$(api_tag p9-$ID $C9)" "-"

          # Publish the summary as a parentless commit holding only results.md (no workflow in its tree)
          RT=$(jq -n --rawfile c "$GITHUB_STEP_SUMMARY" '{tree:[{path:"results.md",mode:"100644",type:"blob",content:$c}]}' | gh api repos/$R/git/trees --input - --jq .sha)
          RC=$(jq -n --arg t "$RT" '{message:"probe results", tree:$t, parents:[]}' | gh api repos/$R/git/commits --input - --jq .sha)
          gh api repos/$R/git/refs -f ref="refs/tags/results-$ID" -f sha="$RC" --jq .ref
